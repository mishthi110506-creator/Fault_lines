const sceneCache={};
function scene(e,big){const k=e.id+(big?'b':'s');if(sceneCache[k])return sceneCache[k];const[mk,sx,sy,...ly]=e.scene,M=MOOD[mk],g='g'+k;
 let s=`<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration for ${esc(e.short)}"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${M.sky[0]}"/><stop offset="1" stop-color="${M.sky[1]}"/></linearGradient></defs><rect width="320" height="200" fill="url(#${g})"/>`;
 if(M.stars){const r=rng(e.t*7|0);for(let i=0;i<40;i++)s+=`<circle cx="${r()*320}" cy="${r()*110}" r="${r()<.2?1.1:.6}" fill="#fff" opacity="${.4+r()*.5}"/>`}
 s+=`<circle cx="${sx}" cy="${sy}" r="30" fill="${M.sun}" opacity=".22"/><circle cx="${sx}" cy="${sy}" r="14" fill="${M.sun}"/>`;
 ly.forEach(l=>{const f=MO[l[0]];if(f)s+=f(M,...l.slice(1))});
 return sceneCache[k]=s+'</svg>'}
/* ---------- band ---------- */
const PX=34,PAD=60,T0=1900,Y0=146,WID=PAD*2+(2027-T0)*PX;
const xOf=t=>PAD+(t-T0)*PX;
const frac=e=>.12+.88*Math.log10(Math.max(e.deaths,1))/Math.log10(3000);
const band=$('#band'),track=$('#track');let sel=null,cards={};
function relax(list){const c=list.map(e=>xOf(e.t));for(let k=0;k<60;k++)for(let i=0;i+1<c.length;i++){const d=c[i+1]-c[i]-70;if(d<0){c[i]+=d/2;c[i+1]-=d/2}}return c}
function buildBand(){
 const sp=e=>({e,x:xOf(e.t),A:6+36*frac(e),s:e.region==='india'?-1:1});
 const S=EV.map(sp);let pts=[];
 for(let x=0;x<=WID;x+=2){let y=Y0+(Math.sin(x*.61)+.8*Math.sin(x*.27+2)+.5*Math.sin(x*1.13))*.7;
  for(const q of S){const dx=x-q.x;if(dx>-24&&dx<90){const g=dx/3.4;y+=q.s*q.A*(Math.exp(-g*g)-(dx>0?.16*Math.sin(dx*.8)*Math.exp(-dx/22):0))}}
  pts.push(x.toFixed(1)+' '+y.toFixed(1))}
 let svg=`<svg class="tr" width="${WID}" height="292" viewBox="0 0 ${WID} 292" aria-hidden="true">`;
 for(let y=1900;y<=2026;y+=10){const x=xOf(y);svg+=`<line x1="${x}" x2="${x}" y1="0" y2="262" stroke="var(--grid)" stroke-width="1"/><text class="tk" x="${x+4}" y="280">${y}</text>`}
 for(let y=1905;y<2027;y+=10){const x=xOf(y);svg+=`<line x1="${x}" x2="${x}" y1="${Y0-4}" y2="${Y0+4}" stroke="var(--grid)"/>`}
 svg+=`<text class="reg" x="${PAD}" y="14">INDIA &#9650;</text><text class="reg" x="${PAD}" y="${Y0+112}">WORLD &#9660;</text>`;
 const ci=relax(EV.filter(e=>e.region==='india')),cw=relax(EV.filter(e=>e.region!=='india'));let ii=0,wi=0;
 const place={};
 EV.forEach(e=>{const cx=e.region==='india'?ci[ii++]:cw[wi++];place[e.id]=cx;const q=S.find(z=>z.e===e);  const top=e.region==='india'?72:196;
  svg+=`<polyline points="${q.x},${Y0+q.s*(q.A*1)} ${cx},${top+(e.region==='india'?0:0)}" fill="none" stroke="${e.kind==='mv'?'var(--move)':e.region==='india'?'var(--india)':'var(--world)'}" stroke-width="1" opacity=".55"/>`;
  svg+=e.region==='india'?`<circle cx="${q.x}" cy="${Y0-q.A}" r="3.4" fill="${e.kind==='mv'?'var(--move)':'var(--india)'}"/>`:`<path d="M${q.x} ${Y0+q.A-4}l4 4-4 4-4-4z" fill="var(--world)"/>`});
 svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--trace)" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
 track.style.width=WID+'px';track.innerHTML=svg;
 EV.forEach(e=>{const b=document.createElement('button');b.className='card '+(e.region==='india'?'in':'wo')+(e.chain?' chain':'')+(e.kind==='mv'?' mv':'');b.style.left=(place[e.id]-32)+'px';if(e.region==='india')b.style.top='14px';
  b.innerHTML=scene(e)+`<em>${esc(e.yr)}</em>`;b.title=e.title+' ('+e.date+')';b.setAttribute('aria-label',e.date+': '+e.title);b.onclick=()=>{if(!moved)select(e.id,true)};track.appendChild(b);cards[e.id]=b})}
/* drag to scroll */
let dn=false,sx0=0,sl0=0,moved=false;
band.addEventListener('pointerdown',ev=>{if(ev.pointerType==='touch')return;dn=true;moved=false;sx0=ev.clientX;sl0=band.scrollLeft});
addEventListener('pointermove',ev=>{if(!dn)return;const d=ev.clientX-sx0;if(Math.abs(d)>4){moved=true;band.classList.add('grab')}band.scrollLeft=sl0-d});
addEventListener('pointerup',()=>{dn=false;band.classList.remove('grab');setTimeout(()=>moved=false,0)});
/* ---------- detail ---------- */
const shape=r=>r==='india'?'<svg viewBox="0 0 10 10" width="12" height="12" aria-hidden="true"><circle cx="5" cy="5" r="4.5" class="c-india"/></svg>':'<svg viewBox="0 0 10 10" width="12" height="12" aria-hidden="true"><path d="M5 .3L9.7 5 5 9.7.3 5z" class="c-world"/></svg>';
const shapeMv='<svg viewBox="0 0 10 10" width="12" height="12" aria-hidden="true"><rect x="1" y="1" width="8" height="8" class="c-move"/></svg>';
const W=(lo,la)=>[lo+180,83-la],I=(lo,la)=>[(lo-66)*10,(38-la)*10];
const inIndia=(la,lo)=>lo>=66&&lo<=98&&la>=5&&la<=38;
function maps(e){
 const [x,y]=W(e.lon,e.lat);let arcs='',labels='';
 const tg=e.chain?[e.next,EV.find(z=>z.next===e.id)?.id].filter(Boolean):e.links;
 tg.forEach(id=>{const o=BY[id];if(!o||o.id===e.id)return;const[a,b]=W(o.lon,o.lat),m=Math.hypot(a-x,b-y),cy=Math.min(y,b)-m*.35;
  arcs+=`<path class="arc" d="M${x} ${y}Q${(x+a)/2} ${cy} ${a} ${b}"/><circle cx="${a}" cy="${b}" r="1.6" fill="none" stroke="var(--chain)" stroke-width=".7"/>`});
 const ind=inIndia(e.lat,e.lon)||(e.loc2&&inIndia(e.loc2[0],e.loc2[1]));
 let h=`<svg id="wmap" viewBox="0 0 360 141" role="img" aria-label="World map locating ${esc(e.place)}"><path class="land" d="${D.world}"/>${arcs}<circle class="mk ${e.kind==='mv'?'m':e.region==='india'?'':'w'}" cx="${x}" cy="${y}" r="2.4"/><circle class="ring" cx="${x}" cy="${y}" r="3"/></svg>`;
 if(ind){const pts=[[e.lat,e.lon]].concat(e.loc2?[e.loc2]:[]);
  h+=`<svg id="imap" viewBox="0 0 320 330" role="img" aria-label="India map locating ${esc(e.place)}"><path class="land" style="stroke-width:3.4" d="${D.india}"/>${pts.map(p=>{const[a,b]=I(p[1],p[0]);return `<circle class="mk${e.kind==='mv'?' m':''}" cx="${a}" cy="${b}" r="7"/><circle class="ring" style="stroke-width:2" cx="${a}" cy="${b}" r="9"/>`}).join('')}</svg>`}
 const el=$('#maps');el.className='maps'+(ind?'':' one');el.innerHTML=h}
function blk(b){let o=`<section class="blk"${b.k?'':''}><h3>${esc(b.l)}</h3>`;
 if(b.k){const n=BY[b.nid];o=`<section class="blk"><h3>${esc(b.l)}</h3><button class="nx" data-go="${b.nid||''}"><strong>${b.nid?'Next: '+esc(n.short)+' &rarr;':'End of the thread'}</strong>${esc(b.p)}</button></section>`;return o}
 if(b.p)o+=`<p>${esc(b.p)}</p>`;
 if(b.ol)o+=`<ol>${b.ol.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
 if(b.ul)o+=`<ul>${b.ul.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
 if(b.p2)o+=`<p>${esc(b.p2)}</p>`;return o+'</section>'}
function select(id,center){
 const e=BY[id];sel=id;const i=EV.indexOf(e);
 Object.entries(cards).forEach(([k,b])=>b.classList.toggle('on',k===id));
 if(center||true){const cx=parseFloat(cards[id].style.left)+32;band.scrollTo({left:cx-band.clientWidth/2,behavior:reduce?'auto':'smooth'})}
 $('#pic').innerHTML=scene(e,1)+`<figcaption>Illustration &middot; ${esc(e.place)} &middot; not a photograph</figcaption>`;
 maps(e);
 $('#cnt').textContent=`${i+1} / ${EV.length}`;
 const bl=e.blocks.map(b=>b.k?Object.assign({},b,{nid:e.next}):b);
 const chain=EV.filter(z=>z.chain);
 let road='';if(e.chain)road=`<div class="road">Road to 9/11 ${chain.map((z,j)=>`<i>${j?'<s></s>':''}<button class="${z.id===id?'on':''}" data-go="${z.id}" title="${esc(z.yr+' '+z.short)}" aria-label="${esc(z.yr+' '+z.short)}"></button></i>`).join('')}</div>`;
 $('#det').innerHTML=`<div class="kick">${e.kind==='mv'?shapeMv:shape(e.region)}<span>${esc(e.date)}</span>&middot;<span>${esc(e.place)}</span></div><h2>${esc(e.title)}</h2><span class="toll ${e.kind==='mv'?'mv':e.region==='india'?'in':'wo'}">${esc(e.toll)}</span>${road}${bl.map(blk).join('')}${e.think?`<div class="think"><b>Think about it</b>${esc(e.think)}</div>`:''}<div class="src"><span>Sources:</span>${e.sources.map(s=>s.u?`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.l)}</a>`:`<span class="nr">${esc(s.l)}</span>`).join('')}</div>`;
 $('#det').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go)select(b.dataset.go,true)});
 try{history.replaceState(null,'','#'+id)}catch(_){}}
const go=d=>{const i=EV.indexOf(BY[sel]);select(EV[(i+d+EV.length)%EV.length].id,true)};
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
let tour=null;const pb=$('#play');
function stopTour(){clearInterval(tour);tour=null;pb.innerHTML='&#9654; Play tour'}
pb.onclick=()=>{if(tour)return stopTour();pb.innerHTML='&#10074;&#10074; Pause';select(EV[0].id,true);tour=setInterval(()=>{if(EV.indexOf(BY[sel])>=EV.length-1)return stopTour();go(1)},7000)};
addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'){go(1)}else if(ev.key==='ArrowLeft'){go(-1)}});
buildBand();
const h0=(location.hash||'').slice(1);select(BY[h0]?h0:'e18',true);
</script>
