h2{font:900 clamp(32px,5vw,52px)/.95 'Big Shoulders Display',Impact,sans-serif;text-transform:uppercase;margin:8px 0 12px;text-wrap:balance}
.toll{display:inline-flex;gap:8px;align-items:baseline;border:1.5px solid var(--ink);padding:3px 10px;border-radius:99px;font:500 13px 'IBM Plex Mono',monospace}
.toll.mv{border-color:var(--move);color:var(--move)}.toll.in{border-color:var(--india);color:var(--india)}.toll.wo{border-color:var(--world);color:var(--world)}

.src .nr{border:1px solid var(--line);padding:2px 9px;border-radius:99px;color:var(--ink)}.src a{color:var(--ink);border:1px solid var(--line);padding:2px 9px;border-radius:99px;text-decoration:none}.src a:hover{background:var(--sunk)}
.road{margin-top:18px;padding:10px 12px;border-radius:6px;background:var(--sunk);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--chain)}

.road s{width:12px;height:2px;background:var(--chain);opacity:.5}

<script>
const D={"events":[{"id":"e1","yr":"1908","t":1908.33,"date":"29–30 April 1908","place":"Muzaffarpur, Bihar (British India)","short":"Muzaffarpur bomb","title":"A bomb meant for a magistrate","region":"india","deaths":2,"toll":"2 killed","lat":26.12,"lon":85.39,"loc2":null,"links":["e3","e2"],"blocks":[{"l":"What happened","p":"Two young Bengali revolutionaries, Khudiram Bose and Prafulla Chaki, threw a bomb at a carriage they believed carried the magistrate Douglas Kingsford. He was not in it. The bomb killed two British women of the Kennedy family. Accounts differ on the exact night; the pair were in position on the evening of 29 April."},{"l":"Why it mattered","p":"This is an early case of revolutionary violence against British rule in India. Colonial courts treated the bombers as criminals, while many Indians later remembered them as martyrs. The same act carries opposite labels depending on who tells the story."},{"l":"What changed after","p":"Chaki shot himself at Mokameh station to avoid arrest, and Bose, aged 18, was hanged on 11 August 1908. The investigation led to a conspiracy trial of Aurobindo Ghosh and others."},{"l":"Echoes today","p":"Whether a struggle against colonial rule can ever be called terrorism is one reason states have struggled to agree a single international definition of the term."}],"think":"Was Muzaffarpur terrorism, resistance, or both? What would change your answer: the intended target, the aim, or who is writing the history?","scene":["night",245,48,["hills",150,16,11,3],["groundrect",160,4],["lamp",62,160],["carriage",150,160,1.5]],"chain":false,"next":null,"sources":[{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/Khudiram_Bose"}]},{"id":"e2","yr":"1914","t":1914.49,"date":"28 June 1914","place":"Sarajevo, Austria-Hungary (now Bosnia and Herzegovina)","short":"Sarajevo","title":"Two shots in Sarajevo","region":"world","deaths":2,"toll":"2 killed","lat":43.86,"lon":18.41,"loc2":null,"links":["e1","e14"],"blocks":[{"l":"What happened","p":"Gavrilo Princip, a 19-year-old Bosnian Serb, shot Archduke Franz Ferdinand and his wife Sophie after an earlier grenade attack on their car had failed."},{"l":"Why it mattered","p":"The conspirators wanted Bosnia freed from Austro-Hungarian rule. Austria-Hungary treated the murders as a Serbian state affair. Within five weeks the alliance system had turned a regional crisis into the First World War. Historians still debate how far Serbian officials helped the plotters."},{"l":"What changed after","p":"Austria-Hungary declared war on Serbia on 28 July 1914, and the Triple Alliance and Triple Entente were pulled in one after another."},{"l":"Echoes today","p":"A single act of political violence can set off a far larger crisis when states already distrust each other. The risk reappears in every India–Pakistan crisis on this timeline."}],"think":"Sarajevo is usually called an assassination, not terrorism. Is the label useful, or does it hide something? Why do some political killings become ‘terrorism’ in memory and others do not?","scene":["haze",250,50,["hills",118,26,2,3],["block",22,150,36,64,3,"grid"],["block",268,150,38,70,3,"grid"],["bridge",128,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/biography/Franz-Ferdinand-Archduke-of-Austria-Este"}]},{"id":"e3","yr":"1946","t":1946.55,"date":"22 July 1946","place":"Jerusalem, British-ruled Palestine","short":"King David Hotel","title":"The bombing of the King David Hotel","region":"world","deaths":91,"toll":"91 killed","lat":31.78,"lon":35.22,"loc2":null,"links":["e1","e4"],"blocks":[{"l":"What happened","p":"The Zionist underground group Irgun blew up a wing of the King David Hotel, which housed British government and military offices. It killed 91 people: British, Arab and Jewish staff, soldiers and civilians."},{"l":"Why it mattered","p":"The attack was part of an armed campaign to push Britain out of Mandate Palestine. Irgun said it had given a warning; British officials disputed that it was adequate. The bombing hardened British opinion of the underground groups."},{"l":"What changed after","p":"Mainstream Zionist leaders condemned the attack. Irgun’s commander, Menachem Begin, later became prime minister of Israel."},{"l":"Echoes today","p":"Movements that used terror have later governed states. That history shapes how successor governments and international bodies argue about who counts as a terrorist."}],"think":"Begin’s career runs from underground commander to prime minister. How should historians and diplomats treat leaders whose pasts include violence against civilians?","scene":["day",255,45,["hills",128,22,3,3],["block",66,170,188,104,4,"arch"],["groundrect",170,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/place/King-David-Hotel"}]},{"id":"e4","yr":"1972","t":1972.68,"date":"5–6 September 1972","place":"Munich, West Germany","short":"Munich Olympics","title":"Hostages at the Olympic Village","region":"world","deaths":12,"toll":"12 killed","lat":48.18,"lon":11.55,"loc2":null,"links":["e3","e20"],"blocks":[{"l":"What happened","p":"Eight Palestinian militants of Black September seized Israeli athletes and coaches at the Olympic Village and demanded the release of 200 prisoners. A failed rescue left all nine remaining hostages, five of the captors and a West German policeman dead, after two Israelis had been killed at the start."},{"l":"Why it mattered","p":"The attackers chose the Games for the world’s attention; global television was part of the weapon. Competition was paused for a day for a memorial service and then resumed, a decision widely criticised."},{"l":"What changed after","p":"Security at the Olympics was tightened for good. West Germany created the GSG 9 counter-terrorism police unit, and several states built dedicated hostage-rescue forces."},{"l":"Echoes today","p":"Every major sporting event now plans its security around the lesson of Munich: spectacle attracts attackers."}],"think":"Why does terrorism so often target events the whole world is watching? What does that tell you about who the violence is really addressed to?","scene":["dusk",70,66,["hills",140,12,4,3],["tent",212,150,150],["block",20,150,40,66,4,"grid"],["block",66,150,34,46,4,"grid"],["groundrect",150,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/Munich-1972-Olympic-Games"}]},{"id":"e5","yr":"1983","t":1983.81,"date":"23 October 1983","place":"Beirut, Lebanon","short":"Beirut barracks","title":"Truck bombs at the Beirut barracks","region":"world","deaths":299,"toll":"299 killed","lat":33.83,"lon":35.5,"loc2":null,"links":["e6"],"blocks":[{"l":"Background","p":"Lebanon was in a civil war (1975–90). US and French troops were in Beirut as peacekeepers. The US Marines of the 1st Battalion, 8th Marines were based at Beirut International Airport, in a four-storey building used as their barracks."},{"l":"The attack, step by step","p":"Sunday morning, 23 October 1983, around 06:22. A 19-ton yellow Mercedes truck drove to the airport. The Marines were expecting a water truck; it was a hijacked truck carrying explosives.","ol":["The driver turned onto the access road and circled the parking lot.","He sped up and crashed through a five-foot wall of barbed wire. The wire popped ‘like somebody walking on twigs’.","The truck passed between two sentry posts, went through an open gate, and smashed through a guard shack.","It drove into the lobby of the barracks."]},{"l":"Why the guards could not stop it","p":"The sentries’ rules of engagement made a quick response very hard. Their weapons were loaded but ‘bolt closed, weapon on safe and no round in the chamber.’ Only one sentry, LCpl Eddie DiFranco, managed to chamber a round. By then the truck was already inside the entryway."},{"l":"The explosion","p":"A US court later identified the bomber as an Iranian named Ismail Ascari. The explosives were estimated at about 12,000 pounds of TNT or more.","ul":["The blast lifted the whole building, sheared its concrete columns, and the building ‘fell in upon itself.’","It collapsed into rubble and killed 241 American servicemen.","The bomb was a gas-enhanced device: butane canisters plus PETN, which works like a fuel-air (thermobaric) weapon. It sat on concrete topped with marble so the blast would go upward.","The parts were simple and easy to get, yet the weapon was deadly.","The FBI found it was so strong that it probably would have brought the building down even if the sentries had stopped the truck at the gate."]},{"l":"Second attack","p":"Less than ten minutes later, a similar bomb hit the French paratroopers’ barracks, 6 km away in West Beirut. Another 58 French soldiers died. In total, 299 US and French servicemen were killed."},{"l":"Who was behind it","p":"A group calling itself Islamic Jihad claimed the attacks. Known figures were later linked to Hezbollah. A 2003 US court ruled that Hezbollah acted at Iran’s direction. The April 1983 US embassy bombing (63 dead) was also linked to Islamic Jihad."},{"l":"What it changed","ul":["It was the deadliest attack on US Marines since Iwo Jima in 1945.","US and international forces left Lebanon in February 1984.","It showed that one suicide bombing could change a superpower’s policy.","In 2007 a US judge ordered Iran to pay $2.65 billion to survivors and families."]},{"l":"Link to next","p":"Suicide bombing and state backing had worked. The tactic spread, and two years later it hit the skies with Air India 182. Beirut proved that one attack could change a great power’s policy. Two years later, Air India 182 showed that terrorists could plan in one country and strike across the world.","k":"next"}],"think":null,"scene":["dawn",170,128,["hills",132,12,5,3],["block",112,172,120,78,4,"grid"],["palms",38,176,2],["palms",288,176,2],["groundrect",172,5]],"chain":true,"next":"e6","sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/1983-Beirut-barracks-bombings"}]},{"id":"e6","yr":"1985","t":1985.47,"date":"23 June 1985","place":"Atlantic Ocean off Ireland (Toronto–London–Delhi flight)","short":"Air India 182","title":"Air India Flight 182 is bombed","region":"india","deaths":329,"toll":"329 killed","lat":51.0,"lon":-12.8,"loc2":null,"links":["e5","e7"],"blocks":[{"l":"Background","p":"In June 1984, the Indian army attacked the Golden Temple in Amritsar (Operation Blue Star), the holiest Sikh shrine. Some Sikh extremists in Canada wanted revenge on India. Canada-based Khalistani extremists, linked to the group Babbar Khalsa, planned the attack. The bomb was built in Canada, as part of a plot developed in Canada."},{"l":"The attack, step by step","ol":["Early June 1985: Two suitcases were checked in at Vancouver. One was for Air India 182. The other was for a flight to Tokyo and then on to Air India 301.","23 June 1985, Tokyo: The bag for the Tokyo flight exploded at Narita airport while being moved. It killed two baggage handlers. It was meant to blow up later, on a plane.","Same day, over the Atlantic: Air India 182 was a Boeing 747 flying from Canada to London and then Delhi. About 31,000 feet up, near Ireland, a bomb in the cargo hold went off.","The plane broke apart and crashed into the sea. Everyone on board died."],"p2":"Two bombs, same plot, same day. That shows it was planned, not random."},{"l":"The toll","ul":["329 people died.","Most were Canadian citizens. Many were children.","It was the deadliest aviation terrorist attack before 9/11."]},{"l":"Why the security failed","p":"The inquiry report ran about 4,000 pages in five volumes. It blamed ‘a cascading series of errors’ by Canadian police and security forces.","ul":["Canadian intelligence had warnings about the plot.","Checked bags were not properly matched to passengers.","Agencies did not share information well."]},{"l":"Who was behind it","p":"Canada’s intelligence agency later named Canada-based Khalistani extremists. The suspects were acquitted in 2005. Only one man, Inderjit Singh Reyat, was ever convicted, for helping build the bomb."},{"l":"What it changed","ul":["It exposed how weak airport security was.","Airlines and governments began to treat checked bags as a real threat.","It showed that terrorist plots could be planned in one country and carried out across the world."]},{"l":"Link to next","p":"Weak airport security became a global issue. Just three years later, Lockerbie hit another airline.","k":"next"}],"think":"Which security failure mattered most?","scene":["dusk",240,128,["clouds",5],["sea",150],["plane",140,78,1.6,-7]],"chain":true,"next":"e7","sources":[{"l":"South Asia Terrorism Portal","u":"https://www.satp.org/satporgtp/countries/india/states/punjab/backgrounder/kanishka.htm"},{"l":"Outlook News Desk","u":"https://www.outlookindia.com/national/kanishka-bombing-41-years-on-families-oppose-reported-rcmp-move-to-put-probe-inactive"}]},{"id":"e7","yr":"1988","t":1988.97,"date":"21 December 1988","place":"Lockerbie, Scotland (London–New York flight)","short":"Lockerbie","title":"Pan Am Flight 103 over Lockerbie","region":"world","deaths":270,"toll":"270 killed","lat":55.12,"lon":-3.35,"loc2":null,"links":["e6","w93"],"blocks":[{"l":"Background","p":"Pan Am 103 was a Boeing 747 flying from London to New York, four days before Christmas. Many passengers were Americans going home for the holidays. Libya was in conflict with the US at the time, and Libya was later held responsible."},{"l":"The attack, step by step","ol":["Malta: A suitcase holding the bomb was loaded onto a flight in Malta. The bomb was Semtex hidden in a Toshiba cassette recorder.","Transfer: The bag was moved onto Pan Am 103 without anyone catching it.","21 December 1988: The plane took off. A bomb exploded in the forward cargo area 38 minutes after takeoff.","The plane broke apart in the air. Debris fell over Lockerbie, Scotland, across about 845 square miles."]},{"l":"The toll","ul":["259 people on board died, plus 11 people on the ground. Total: 270.","190 of those on board were Americans (some sources say 189).","Over three years, investigators questioned more than 15,000 people in more than 30 countries."]},{"l":"What happened next, in order","ol":["Nov 1991: Two Libyans were indicted on 270 counts.","Apr 1992: The UN imposed air and arms sanctions on Libya.","Apr 1999: Libya handed over the suspects.","Jan 2001: Megrahi was found guilty and jailed for at least 27 years. Fhimah was found not guilty.","2003: Libya agreed to pay $2.7 billion, about $10 million per family.","Sept 2003: UN sanctions were lifted."]},{"l":"Why it matters","p":"This attack was backed by a state, so the world answered it with sanctions and courts, not war. It also took years to get justice: 11 years just to get the suspects handed over."},{"l":"Link from Air India","p":"Air India 182 showed that planes were easy targets. Three years later, Lockerbie proved it again, this time with a state behind the bomb. Together they made aviation security a global issue."},{"l":"Link to next","p":"Until now, the attacks were state-backed and mostly happened abroad. The next one hit US soil, and a non-state network was behind it.","k":"next"}],"think":"Did sanctions work?","scene":["night",250,44,["hills",146,16,6,3],["pines",0,320,162,10,8,5],["spire",215,156,5],["plane",96,60,1.2,-5],["groundrect",162,5]],"chain":true,"next":"w93","sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/Pan-Am-flight-103"}]},{"id":"w93","yr":"1993","t":1993.16,"date":"26 February 1993","place":"World Trade Center, New York City","short":"WTC 1993","title":"The first World Trade Center bombing","region":"world","deaths":6,"toll":"6 killed","lat":40.7116,"lon":-74.0134,"loc2":null,"links":["e7","e9"],"blocks":[{"l":"Background","p":"The World Trade Center in New York had two tall towers, the ‘Twin Towers,’ with 110 floors each. In 1993 it was a symbol of American money and power. Earlier attacks like Beirut and Lockerbie were state-backed. This one was not."},{"l":"The attack, step by step","ol":["26 February 1993: A van packed with explosives was parked in the underground garage of the towers.","The bomb was about 1,300 pounds (sources say 1,200 to 1,500).","It exploded and left a crater over six storeys deep.","Smoke spread through 46 of the 110 floors."],"p2":"The goal: Ramzi Yousef, the bomber, hoped one tower would fall into the other. It failed, but the plan shows how big the target was."},{"l":"The toll","ul":["6 killed, over 1,000 injured.","Damage was over $500 million."]},{"l":"What happened next, in order","ul":["Six people were convicted. A seventh suspect is still at large.","March 1994: Four were convicted and each got 240 years."]},{"l":"Why it matters","ul":["It proved that terrorists could hit the US at home, not just abroad.","It was done by a network, not a state.","The link to 9/11: Yousef’s uncle, Khalid Sheikh Mohammed, was later named ‘the chief architect of 9/11.’ That is a direct thread from 1993 to 2001."]},{"l":"Link from Lockerbie","p":"Lockerbie showed the world answering a state with sanctions and courts. Four years later, the threat changed. The attacker was not a country, but a group of people working together, and the target was on US soil."},{"l":"Link to next","p":"Just two weeks later, a huge coordinated attack hit Mumbai. It showed the same pattern: networks, not lone attackers.","k":"next"}],"think":"Why is this attack called ‘forgotten’?","scene":["dusk",70,72,["city",152,3,3,52,1],["twin",160,172,4],["groundrect",172,5]],"chain":true,"next":"e9","sources":[{"l":"Britannica","u":"https://www.britannica.com/biography/Ramzi-Ahmed-Yousef"}]},{"id":"e9","yr":"1993","t":1993.2,"date":"12 March 1993","place":"Bombay (Mumbai), Maharashtra","short":"Bombay blasts","title":"Black Friday: the Bombay serial blasts","region":"india","deaths":257,"toll":"257 killed","lat":18.93,"lon":72.83,"loc2":null,"links":["w93","e11","e17"],"blocks":[{"l":"Background","p":"In December 1992 and January 1993, riots broke out in Bombay (now Mumbai) after the Babri Masjid mosque was demolished. About 900 people were killed in those riots. The Srikrishna Commission was set up to look into them. The March blasts came soon after, and many see them as revenge for the riots."},{"l":"The attack, step by step","ol":["12 March 1993: Bombs went off across Bombay one after another, in about two hours.","A car bomb hit the Bombay Stock Exchange at 1:30 pm.","Other targets included the Air India building and two hotels.","In total, 12 coordinated bombs hit the city (sources disagree on 12 or 13 blasts)."],"p2":"These were the most destructive blasts in Indian history up to that time. The targets were chosen to hit the country’s money and business centre."},{"l":"The toll","ul":["257 killed, over 713 injured.","About Rs 27 crore of property destroyed."]},{"l":"What happened next, in order","ol":["The blasts were linked to underworld boss Dawood Ibrahim.","Tiger Memon, the mastermind, was never taken into custody.","The special TADA court convicted 100 people and acquitted 23.","2013: The Supreme Court upheld Yakub Memon’s death sentence and reduced 10 others to life.","2015: Yakub Memon was hanged."]},{"l":"Why it matters","ul":["It showed the same lesson as the WTC bomb: organised cross-border networks, not lone attackers, are the threat.","The plot involved people planning across borders, not just one group in one place.","Justice was uneven. The blast victims got trials and verdicts, but the riot victims got far less justice."]},{"l":"Link from the WTC bombing","p":"The WTC bombing showed a network striking the US. Two weeks later, Mumbai showed a network striking India. In 1993, two different countries faced the same kind of threat."},{"l":"Link to next","p":"Both 1993 attacks showed that networks could plan across borders. Five years later, one network struck two countries at once: the US embassies in Kenya and Tanzania.","k":"next"}],"think":"The blasts followed communal riots. Does explaining why an attack happened excuse it? How do historians keep ‘explanation’ and ‘justification’ apart?","scene":["haze",250,52,["city",152,9,3,72,1],["block",196,178,40,128,4,"tower"],["sea",176],["groundrect",186,5]],"chain":true,"next":"e11","sources":[{"l":"Indo-Asian News Service","u":"https://www.business-standard.com/article/news-ians/facts-related-to-the-1993-mumbai-serial-blasts-115072101293_1.html"}]},{"id":"e10","yr":"1995","t":1995.3,"date":"19 April 1995","place":"Oklahoma City, United States","short":"Oklahoma City","title":"The Oklahoma City truck bomb","region":"world","deaths":168,"toll":"168 killed","lat":35.47,"lon":-97.52,"loc2":null,"links":["e23","e13"],"blocks":[{"l":"What happened","p":"A truck bomb destroyed the Alfred P. Murrah Federal Building, killing 168 people, 19 of them children, and injuring more than 500."},{"l":"Why it mattered","p":"The bombers, Timothy McVeigh and Terry Nichols, came from the anti-government militia milieu and were angry about the Waco siege, which had ended on the same date two years earlier. The deadliest terror attack on US soil before 9/11 was domestic, not foreign."},{"l":"What changed after","p":"McVeigh was executed in 2001. Congress passed the Antiterrorism and Effective Death Penalty Act in 1996."},{"l":"Echoes today","p":"The 2026 Global Terrorism Index found that lone actors carried out 93% of fatal terrorist attacks in the West over the past five years, an echo of the ‘leaderless’ extremism seen here."}],"think":"After 9/11 the public debate centred on foreign groups. What does Oklahoma City suggest about threat assessments that focus on a single ideology or region?","scene":["day",250,42,["hills",150,10,10,3],["block",80,172,160,88,4,"grid"],["pines",0,320,172,6,14,5],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/Oklahoma-City-bombing"},{"l":"Institute for Economics & Peace","u":"https://www.visionofhumanity.org/global-terrorism-falls-to-a-decade-low-but-western-fatalities-surge/"}]},{"id":"e11","yr":"1998","t":1998.6,"date":"7 August 1998","place":"Nairobi, Kenya, and Dar es Salaam, Tanzania","short":"East Africa embassies","title":"Two US embassies, one morning","region":"world","deaths":224,"toll":"224 killed","lat":-1.29,"lon":36.82,"loc2":[-6.8,39.28],"links":["e9","e13"],"blocks":[{"l":"Background","p":"Osama bin Laden led al-Qaeda, a network of fighters from many countries. He was angry that US troops had been stationed in Saudi Arabia since 1990. In 1996 and again in February 1998, he publicly called for attacks on Americans. Most Americans did not take it seriously until this attack. The US had embassies in Nairobi (Kenya) and Dar es Salaam (Tanzania). They were busy city sites, close to ordinary streets, offices and markets. That made them easy to reach and put many civilians nearby."},{"l":"The attack, step by step","ol":["Morning of 7 August 1998: Trucks packed with explosives were driven up to both embassies, in two countries, within minutes of each other.","Both bombs exploded. The source calls them ‘nearly simultaneous,’ which shows it was one planned operation, not two separate attacks.","In Nairobi, the blast also brought down a nearby office building full of people. This is why the toll there was so high.","In Dar es Salaam, the damage and deaths were smaller."]},{"l":"The toll","ul":["224 killed, over 4,500 injured.","12 of the dead were Americans.","Nairobi: 213 killed. Dar es Salaam: 12 killed (other sources say 11).","Most victims were African. They were local passers-by and workers, not the Americans the attackers targeted."]},{"l":"The investigation","ul":["Over 900 FBI agents were sent overseas. It was a huge international investigation.","It traced the attacks to bin Laden and al-Qaeda.","US investigators began to suspect that Ramzi Yousef (WTC 1993) had ties to bin Laden. This connected the 1993 bombing to the same wider network."]},{"l":"The US response","p":"On 20 August 1998, the US answered with airstrikes on targets in Afghanistan and Sudan."},{"l":"Why it matters","ul":["It introduced the American public to bin Laden and al-Qaeda.","It showed a network could hit two countries at once, with planning, money and people across borders.","Most victims were African, so terrorism aimed at the US mostly killed local people.","The airstrikes did not stop al-Qaeda. Three years later came 9/11."]},{"l":"Link from Mumbai","p":"Both 1993 attacks showed that networks could plan across borders. Five years later, one network struck two countries at once. Al-Qaeda had announced itself."},{"l":"Link to the end (9/11)","p":"This closes the chain. The 1993 WTC bombing, the embassy attacks and bin Laden’s network all lead to 9/11. Terrorism had grown from state-backed attacks in 1983 into a global network by 1998.","k":"next"}],"think":"Why did most victims turn out to be local people?","scene":["day",60,45,["hills",140,12,11,3],["block",78,172,84,92,4,"grid"],["block",190,172,74,64,4,"grid"],["palms",38,176,2],["palms",288,176,2],["groundrect",172,5]],"chain":true,"next":"e13","sources":[{"l":"Federal Bureau of Investigation","u":"https://archives.fbi.gov/archives/news/stories/2003/august/kenbom_080603"}]},{"id":"e12","yr":"1999","t":1999.98,"date":"24–31 December 1999","place":"Kathmandu–Delhi flight, diverted to Amritsar, Lahore, Dubai and Kandahar","short":"IC-814 hijacking","title":"The hijacking of IC-814","region":"india","deaths":1,"toll":"1 killed","lat":31.61,"lon":65.71,"loc2":[31.63,74.87],"links":["e14","e22","e6"],"blocks":[{"l":"What happened","p":"Five Harkat-ul-Mujahideen hijackers took over Indian Airlines Flight 814 after it left Kathmandu and flew it to Kandahar, then under Taliban control. One passenger, Rupin Katyal, was killed."},{"l":"Why it mattered","p":"After a week of negotiations India freed three jailed militants: Masood Azhar, Ahmed Omar Saeed Sheikh and Mushtaq Ahmed Zargar. The Taliban let the hijackers and the released men leave. Azhar went on to found Jaish-e-Mohammed, one of the two groups India blamed for the 2001 Parliament attack, and the group that claimed the 2019 Pulwama attack."},{"l":"What changed after","p":"The ‘Kandahar precedent’ made later governments much more reluctant to bargain with hijackers and fed calls for a tougher counter-terrorism doctrine."},{"l":"Echoes today","p":"Azhar was designated a global terrorist by the UN in 2019, twenty years after his release."}],"think":"India freed three prisoners to end the hijacking, and one later led a group blamed for further attacks. Was the decision right at the time? How should we judge a decision whose costs appear years later?","scene":["dawn",200,128,["mount",150,64,12,3],["groundrect",152,4],["plane",150,148,1.9,0]],"chain":false,"next":null,"sources":[{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/Indian_Airlines_Flight_814"},{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2001_Indian_Parliament_attack"},{"l":"Pulwama Attack","u":"https://www.deccanchronicle.com/nation/pulwama-attack-what-happened-on-february-14-2019-1861219"}]},{"id":"e13","yr":"2001","t":2001.7,"date":"11 September 2001","place":"New York City; Arlington, Virginia; Shanksville, Pennsylvania","short":"9/11","title":"September 11","region":"world","deaths":2977,"toll":"2,977 killed","lat":40.71,"lon":-74.01,"loc2":null,"links":["e11","e14","e12"],"blocks":[{"l":"What happened","p":"Nineteen al-Qaeda hijackers seized four airliners. Two hit the World Trade Center towers, one hit the Pentagon, and a fourth crashed in Pennsylvania after passengers resisted. In all, 2,977 people from 90 nations were killed: 2,753 in New York, 184 at the Pentagon and 40 on Flight 93."},{"l":"Why it mattered","p":"It is the deadliest terrorist attack in history and turned terrorism into the organising issue of world politics. On 28 September 2001 the UN Security Council unanimously adopted Resolution 1373, creating a Counter-Terrorism Committee to monitor how states respond."},{"l":"What changed after","p":"The United States led an invasion of Afghanistan in October 2001, passed the Patriot Act and created the Department of Homeland Security. For India, the attack opened a diplomatic window to argue that cross-border terrorism was a global problem, not only a regional one."},{"l":"Echoes today","p":"Watchlists, aviation screening and financial controls built after 2001 are still in place, and the ‘war on terror’ framing still shapes foreign policy."}],"think":"Resolution 1373 obliged every state to act but did not define terrorism. What problems does that gap create between states that disagree about who is a terrorist?","scene":["day",255,40,["city",152,13,3,58,0],["twin",160,172,4],["groundrect",172,5]],"chain":true,"next":null,"sources":[{"l":"9/11 Memorial & Museum","u":"https://www.911memorial.org/911-faqs"},{"l":"United Nations","u":"https://www.un.org/en/delegate/20th-anniversary-adoption-resolution-1373"}]},{"id":"e14","yr":"2001","t":2001.95,"date":"13 December 2001","place":"New Delhi","short":"Parliament attack","title":"Gunmen at India’s Parliament","region":"india","deaths":9,"toll":"9 killed","lat":28.62,"lon":77.21,"loc2":null,"links":["e12","e18","e21"],"blocks":[{"l":"What happened","p":"Five gunmen entered the Parliament complex and opened fire. Nine people were killed: six Delhi Police personnel, two Parliament Security Service personnel and a gardener. All five attackers were also killed."},{"l":"Why it mattered","p":"Indian authorities blamed Lashkar-e-Taiba and Jaish-e-Mohammed, operating from Pakistan; Lashkar denied involvement. On 20 December India mobilised troops to Kashmir and Punjab, its largest mobilisation since the 1971 war. The build-up is known as Operation Parakram, and Pakistan responded with a build-up of its own."},{"l":"What changed after","p":"The standoff eased after President Musharraf’s January 2002 speech promising action against militancy. After US mediation India called off its planned strike in June 2002, and troops withdrew from October. Afzal Guru, convicted in the case, was hanged at Tihar Jail on 9 February 2013."},{"l":"Echoes today","p":"Parakram was slow, costly and carried nuclear risk. It is the first rung on the crisis ladder traced further down this page."}],"think":"Parakram cost enormous sums and ended without a battle. Was coercive diplomacy a success, a failure, or both? What evidence would you use?","scene":["haze",255,48,["dome",160,150,2.2,4],["palms",40,158,2],["palms",282,158,2],["groundrect",150,5]],"chain":false,"next":null,"sources":[{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2001_Indian_Parliament_attack"},{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2001%E2%80%932002_India%E2%80%93Pakistan_standoff"}]},{"id":"e15","yr":"2004","t":2004.2,"date":"11 March 2004","place":"Madrid, Spain","short":"Madrid trains","title":"Bombs on Madrid’s commuter trains","region":"world","deaths":191,"toll":"191 killed","lat":40.41,"lon":-3.69,"loc2":null,"links":["e16","e13"],"blocks":[{"l":"What happened","p":"Bombs exploded on four commuter trains during the morning rush, killing 191 people and injuring more than 1,800."},{"l":"Why it mattered","p":"The attack came three days before Spain’s general election. The government first blamed ETA, but the evidence pointed to Islamists. The opposition Socialists won an upset victory. About 90% of Spaniards had opposed the Iraq war that the sitting government backed."},{"l":"What changed after","p":"In October 2007, 18 Islamist fundamentalists and three Spanish accomplices were convicted. The new prime minister, Rodríguez Zapatero, withdrew Spain’s troops from Iraq."},{"l":"Echoes today","p":"Scholars still debate whether the attack ‘worked’. Critics say it rewarded the bombers; others say voters punished a government they felt had misled them."}],"think":"Did the Madrid bombers achieve their goal? Compare the claims ‘voters punished a government for misleading them’ and ‘terrorism changed an election’.","scene":["dawn",250,112,["city",138,15,3,62,1],["train",60,172,1.2],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/Madrid-train-bombings-of-2004"}]},{"id":"e16","yr":"2005","t":2005.52,"date":"7 July 2005","place":"London, United Kingdom","short":"London 7/7","title":"The 7/7 London bombings","region":"world","deaths":52,"toll":"52 killed","lat":51.53,"lon":-0.12,"loc2":null,"links":["e15","e20"],"blocks":[{"l":"What happened","p":"Suicide bombers struck three London Underground trains and a double-decker bus within an hour, killing 52 people: 39 on the trains and 13 on the bus."},{"l":"Why it mattered","p":"The bombers were British residents. The attack made ‘home-grown’ terrorism a central concern in Europe, because border controls could not stop it."},{"l":"What changed after","p":"The United Kingdom widened its counter-terrorism powers and expanded the Prevent programme, the part of its CONTEST strategy aimed at stopping radicalisation."},{"l":"Echoes today","p":"Radicalisation online as well as offline remains the main worry of European security services."}],"think":"If attackers grew up in the country they attack, what can policy reach and what can it not? When does counter-radicalisation turn into suspicion of a whole community?","scene":["storm",250,50,["city",140,16,3,72,0],["bus",120,172,1.7],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/London-bombings-of-2005"}]},{"id":"e17","yr":"2006","t":2006.53,"date":"11 July 2006","place":"Mumbai, Maharashtra","short":"Mumbai train blasts","title":"Seven bombs on Mumbai’s trains","region":"india","deaths":189,"toll":"189+ killed","lat":19.05,"lon":72.84,"loc2":null,"links":["e9","e18"],"blocks":[{"l":"What happened","p":"Seven pressure-cooker bombs exploded within about eleven minutes on suburban trains of Mumbai’s Western line during the evening rush. Counts of the dead vary: 189 in trial-era reporting and 209 in later accounts."},{"l":"Why it mattered","p":"The trains are the city’s lifeline, so attacking commuters caused maximum disruption. Investigators later linked the plot to Lashkar-e-Taiba and found involvement of the Indian Mujahideen."},{"l":"What changed after","p":"In 2015 a special court convicted 12 men, five of them sentenced to death. In July 2025 the Bombay High Court acquitted all 12, saying the prosecution had failed to prove its case, and the Supreme Court stayed that order days later."},{"l":"Echoes today","p":"Two decades on, the legal outcome is still unsettled, a reminder of how hard proof can be in mass-casualty cases."}],"think":"What do the 2015 convictions and the 2025 acquittals together tell you about the difference between public certainty and legal proof?","scene":["dusk",250,104,["city",140,17,3,72,1],["train",50,172,1.3],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2006_Mumbai_train_bombings"}]},{"id":"e18","yr":"2008","t":2008.9,"date":"26–29 November 2008","place":"Mumbai, Maharashtra","short":"26/11 Mumbai","title":"Mumbai under siege: 26/11","region":"india","deaths":166,"toll":"166 killed","lat":18.94,"lon":72.83,"loc2":null,"links":["e14","e21","e22","e24"],"blocks":[{"l":"What happened","p":"Ten Lashkar-e-Taiba gunmen came by sea from Karachi and attacked the railway terminus, two luxury hotels, a café and a Jewish centre over almost three days. The attacks killed 166 people. Nine attackers were killed and Ajmal Kasab was captured alive."},{"l":"Why it mattered","p":"The siege was broadcast live and killed foreigners, including six Americans. It put Pakistan-based Lashkar-e-Taiba at the centre of international attention and tested how India would respond to a mass-casualty attack linked to Pakistan."},{"l":"What changed after","p":"India chose not to retaliate militarily. It created the National Investigation Agency and strengthened coastal security. Kasab was hanged on 21 November 2012, and in April 2025 the United States extradited Tahawwur Rana, accused of helping plan the attacks, to India."},{"l":"Echoes today","p":"The restraint India showed after 26/11 is the baseline against which its later responses are measured."}],"think":"In 2008 India held back; in 2016, 2019 and 2025 it struck. What changed: the threat, the technology, domestic politics, or the international environment?","scene":["night",250,42,["city",146,18,3,44,1],["sea",152],["dome",160,160,2,5]],"chain":false,"next":null,"sources":[{"l":"U.S. Department of Justice","u":"https://www.justice.gov/opa/pr/us-extradites-alleged-co-conspirator-2008-mumbai-terrorist-attacks-face-charges-india"},{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/Ajmal_Kasab"}]},{"id":"e19","yr":"2014","t":2014.96,"date":"16 December 2014","place":"Peshawar, Pakistan","short":"Peshawar school","title":"Massacre at an army school in Peshawar","region":"world","deaths":141,"toll":"141+ killed","lat":34.0,"lon":71.55,"loc2":null,"links":["e21","e22"],"blocks":[{"l":"What happened","p":"Six Tehrik-i-Taliban Pakistan gunmen attacked the Army Public School in Peshawar, killing at least 141 people, 132 of them schoolchildren. Some counts run as high as 149."},{"l":"Why it mattered","p":"The TTP said the attack was revenge for the army’s Operation Zarb-e-Azb in North Waziristan. The murder of children united Pakistani politics against the group in a way earlier attacks had not."},{"l":"What changed after","p":"Pakistan lifted its moratorium on executions in terrorism cases, adopted a National Action Plan and let military courts try civilians."},{"l":"Echoes today","p":"Pakistan topped the 2026 Global Terrorism Index for the first time, with 1,139 deaths in 2025. The violence of 2014 never fully ended."}],"think":"Pakistan is accused of sponsoring militants and is also the country most hurt by them. How can both statements be true at once?","scene":["haze",70,55,["mount",140,50,19,3],["block",80,168,160,44,4,"grid"],["pines",0,320,170,8,19,5],["groundrect",168,5]],"chain":false,"next":null,"sources":[{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2014_Peshawar_school_massacre"},{"l":"Institute for Economics & Peace","u":"https://www.visionofhumanity.org/global-terrorism-falls-to-a-decade-low-but-western-fatalities-surge/"}]},{"id":"e20","yr":"2015","t":2015.87,"date":"13 November 2015","place":"Paris and Saint-Denis, France","short":"Paris attacks","title":"Paris, 13 November","region":"world","deaths":130,"toll":"130+ killed","lat":48.86,"lon":2.37,"loc2":null,"links":["e16","e4"],"blocks":[{"l":"What happened","p":"Gunmen and suicide bombers hit the Stade de France, cafés and restaurants, and the Bataclan concert hall in one evening. At least 130 people were killed and more than 350 injured. The Islamic State claimed responsibility."},{"l":"Why it mattered","p":"Islamic State had declared a caliphate in 2014 and held territory in Iraq and Syria. Paris showed it could direct a complex attack in Europe using a network of French and Belgian residents."},{"l":"What changed after","p":"France declared a state of emergency and, for the first time, invoked the EU’s mutual-defence clause. The same network was linked to the 2016 Brussels bombings."},{"l":"Echoes today","p":"The territorial caliphate is gone, but Islamic State and its affiliates remain the deadliest terrorist group in the world, according to the 2026 Global Terrorism Index."}],"think":"France called the attacks an act of war. What follows legally and politically when a state describes terrorism as war?","scene":["night",250,40,["roofs",138,3],["roofs",164,4],["groundrect",188,5]],"chain":false,"next":null,"sources":[{"l":"Encyclopaedia Britannica","u":"https://www.britannica.com/event/Paris-attacks-of-2015"},{"l":"Institute for Economics & Peace","u":"https://www.visionofhumanity.org/global-terrorism-falls-to-a-decade-low-but-western-fatalities-surge/"}]},{"id":"e21","yr":"2016","t":2016.71,"date":"18 September 2016","place":"Uri, Jammu and Kashmir","short":"Uri","title":"The Uri attack and the ‘surgical strikes’","region":"india","deaths":19,"toll":"19 killed","lat":34.08,"lon":74.03,"loc2":null,"links":["e18","e22","e24"],"blocks":[{"l":"What happened","p":"Four militants attacked an Army base at Uri, killing 19 soldiers. India blamed the Pakistan-based Jaish-e-Mohammed."},{"l":"Why it mattered","p":"Eleven days later, on 28–29 September, India announced ‘surgical strikes’ on launch pads across the Line of Control. Pakistan said no such strike had happened and spoke only of cross-border firing. By publicly acknowledging a cross-LoC operation, India broke with decades of quiet restraint."},{"l":"What changed after","p":"India had held back in 2008 and 2001–02 had mobilised for months. In 2016 it chose a short, announced military response instead."},{"l":"Echoes today","p":"It set the template of attack, short delay, and an announced military response."}],"think":"When one side says a strike happened and the other says it did not, how can outsiders judge? Why might both governments prefer their own version?","scene":["dawn",90,124,["mount",140,74,21,3],["pines",0,320,164,16,21,4],["road",178,0]],"chain":false,"next":null,"sources":[{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2016_Indian_Line_of_Control_strike"}]},{"id":"e22","yr":"2019","t":2019.12,"date":"14 February 2019","place":"Pulwama, Jammu and Kashmir","short":"Pulwama and Balakot","title":"Pulwama and Balakot","region":"india","deaths":40,"toll":"40 killed","lat":33.87,"lon":74.93,"loc2":null,"links":["e12","e21","e24"],"blocks":[{"l":"What happened","p":"A suicide bomber drove an explosives-laden vehicle into a CRPF convoy on the Jammu–Srinagar highway, killing 40 personnel. Jaish-e-Mohammed claimed the attack."},{"l":"Why it mattered","p":"On 26 February Indian Air Force jets struck a Jaish camp at Balakot inside Pakistan, widely described as the first Indian airstrike beyond Kashmir since 1971. Pakistan retaliated on 27 February, an Indian pilot was captured and he was returned on 1 March."},{"l":"What changed after","p":"The crisis ended within days without further escalation, but both sides had used air power despite nuclear weapons. Claims about what Balakot destroyed remain disputed."},{"l":"Echoes today","p":"In 2019 the UN also designated Masood Azhar, released in 1999, as a global terrorist."}],"think":"Both countries claimed success after Balakot. What counts as victory in a crisis fought to send signals rather than win territory?","scene":["day",250,44,["mount",130,62,22,3],["pines",0,320,158,12,22,4],["road",178,1]],"chain":false,"next":null,"sources":[{"l":"Pulwama Attack","u":"https://www.deccanchronicle.com/nation/pulwama-attack-what-happened-on-february-14-2019-1861219"},{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2019_India%E2%80%93Pakistan_standoff"}]},{"id":"e23","yr":"2019","t":2019.2,"date":"15 March 2019","place":"Christchurch, New Zealand","short":"Christchurch","title":"Christchurch and the Christchurch Call","region":"world","deaths":51,"toll":"51 killed","lat":-43.53,"lon":172.64,"loc2":null,"links":["e10","e16"],"blocks":[{"l":"What happened","p":"A white-supremacist gunman attacked two mosques during Friday prayers, killing 51 worshippers, and livestreamed the first attack online."},{"l":"Why it mattered","p":"It showed that social platforms could broadcast terrorism in real time, and that far-right networks and lone attackers operate across borders."},{"l":"What changed after","p":"Within weeks New Zealand banned most military-style semi-automatic weapons. In May 2019 New Zealand and France launched the Christchurch Call to eliminate terrorist and violent extremist content online."},{"l":"Echoes today","p":"The 2026 Global Terrorism Index reports that lone actors carried out 93% of fatal terrorist attacks in the West over the past five years."}],"think":"Should platforms be responsible for stopping the spread of attack footage? Who decides what is removed, and what are the risks to free expression?","scene":["dawn",110,124,["hills",138,24,23,3],["mosque",170,158,1.5,5],["groundrect",158,5]],"chain":false,"next":null,"sources":[{"l":"Christchurch Call","u":"https://www.christchurchcall.org/the-christchurch-call-story/"},{"l":"Institute for Economics & Peace","u":"https://www.visionofhumanity.org/global-terrorism-falls-to-a-decade-low-but-western-fatalities-surge/"}]},{"id":"e24","yr":"2025","t":2025.3,"date":"22 April 2025","place":"Baisaran meadow, Pahalgam, Jammu and Kashmir","short":"Pahalgam and Sindoor","title":"Pahalgam and Operation Sindoor","region":"india","deaths":26,"toll":"26 killed","lat":34.02,"lon":75.32,"loc2":null,"links":["e21","e22","e18"],"blocks":[{"l":"What happened","p":"Gunmen attacked tourists at Baisaran meadow near Pahalgam, killing 26 people: 25 tourists and a local pony operator who tried to protect them. The Resistance Front, described by Indian officials as an offshoot of Lashkar-e-Taiba, was blamed."},{"l":"Why it mattered","p":"The attack hit tourism and the post-2019 story of normalcy in Kashmir. India suspended the Indus Waters Treaty, and Pakistan answered with measures of its own."},{"l":"What changed after","p":"Operation Sindoor began on 7 May 2025, when India struck nine sites in Pakistan and Pakistan-administered Kashmir. India called the action ‘focussed, measured and non-escalatory’. After four days of exchanges a ceasefire was announced on 10 May, following a call between the two militaries’ operations chiefs."},{"l":"Echoes today","p":"Striking inside Pakistan proper has set a high bar for any future response, and both sides have now climbed the ladder twice in six years."}],"think":"The ceasefire came from a call between military chiefs, not a political settlement. What are the risks of a crisis pattern both sides have now rehearsed?","scene":["day",250,40,["mount",124,80,24,3],["hills",150,14,24,4],["pines",0,320,164,18,24,5],["groundrect",168,5]],"chain":false,"next":null,"sources":[{"l":"Pahalgam Attack Anniversary","u":"https://www.thehitavada.com/Encyc/2026/4/22/pahalgam-attack-anniversary.html"},{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2025_India%E2%80%93Pakistan_conflict"}]},{"id":"e25","yr":"2025","t":2025.86,"date":"10 November 2025","place":"Near the Red Fort, Delhi","short":"Red Fort blast","title":"A car explosion at the Red Fort","region":"india","deaths":15,"toll":"15 killed","lat":28.66,"lon":77.24,"loc2":null,"links":["e14","e24"],"blocks":[{"l":"What happened","p":"A car exploded near the Red Fort metro station in the evening. Later reports put the toll at 15, including the driver, with more than 20 injured. Early accounts gave lower numbers; 12 deaths were reported by 12 November."},{"l":"Why it mattered","p":"Hours earlier police had broken up a module in Faridabad, seizing about 2,900 kg of explosives and arresting eight people, three of them doctors. The driver, Dr Umar Mohammed, worked at Al-Falah University and may have acted in panic after the raids. Investigators suspect the device went off prematurely while being moved."},{"l":"What changed after","p":"The National Investigation Agency took over the case and is examining links with Jaish-e-Mohammed and Ansar Ghazwat-ul-Hind. The sources used here do not report a claim of responsibility or a named external sponsor. Check for later developments before you submit."},{"l":"Echoes today","p":"The case is unresolved. It shows that suspects can come from professional backgrounds and that open cases must be described with caution."}],"think":"The Red Fort blast is still under investigation and its facts are still being established. How should historians write about events whose facts are still contested?","scene":["dusk",240,98,["city",140,25,3,40,1],["fort",160,160,240,5],["groundrect",160,5]],"chain":false,"next":null,"sources":[{"l":"Military Grade Explosives","u":"https://www.businesstoday.in/india/story/military-grade-explosives-accidentally-triggered-heres-what-investigators-have-found-so-far-in-the-red-fort-blast-case-501786-2025-11-12"},{"l":"Wikipedia","u":"https://en.wikipedia.org/wiki/2025_Delhi_car_explosion"}]},{"id":"m1","yr":"1926–28","t":1928.12,"date":"1926 – 1928","place":"Lahore and across British India","short":"Simon Commission","title":"‘Simon Go Back’: a commission with no Indians","region":"india","kind":"mv","deaths":0,"toll":"Mass protest","lat":31.55,"lon":74.34,"loc2":null,"links":["e1","m2"],"blocks":[{"l":"The big picture, 1926–1950","p":"These years are the final phase of the freedom struggle and the start of independent India: growing opposition to British rule, mass movements led by Mahatma Gandhi, revolutionary activity, debates over constitutional reform, the impact of the Second World War, and talks on the transfer of power. Independence in 1947 came with Partition. The Constitution, adopted in 1949 and in force from 26 January 1950, made India a republic."},{"l":"What happened","ol":["1926: Talk of a British commission to review constitutional reforms began to draw attention to the question of Indian representation.","November 1927: The British government appointed the Simon Commission to examine the working of the Government of India Act, 1919 and recommend changes. It had no Indian members, which led to widespread opposition.","February 1928: The commission arrived in India and was greeted by protests and the slogan ‘Simon Go Back’.","August 1928: The Nehru Report, prepared under Motilal Nehru, proposed constitutional reforms and dominion status for India.","October–November 1928: Lala Lajpat Rai was injured in a police lathi-charge at a protest in Lahore and died on 17 November.","1928: The Bardoli Satyagraha, led by Vallabhbhai Patel, successfully opposed an increase in land revenue. Patel became widely known as ‘Sardar’."]},{"l":"Why it mattered","p":"A commission to decide India’s constitutional future had no Indian members, and that turned a routine review into a national protest. The Nehru Report was the Indian answer, and Bardoli showed that an organised protest could win."}],"think":"Compare this mass protest with the bombings elsewhere on this timeline. What separates a protest movement from terrorism?","scene":["haze",250,52,["hills",140,12,2,3],["city",152,5,3,50,0],["groundrect",172,5],["figs",40,285,180,10,2]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m2","yr":"1929","t":1929.98,"date":"December 1929","place":"Lahore","short":"Purna Swaraj","title":"Purna Swaraj is declared at Lahore","region":"india","kind":"mv","deaths":0,"toll":"Complete independence","lat":31.55,"lon":74.34,"loc2":null,"links":["m1","m3"],"blocks":[{"l":"What happened","ol":["December: At the Lahore Session of the Indian National Congress, presided over by Jawaharlal Nehru, Purna Swaraj (complete independence) was declared the Congress goal.","31 December: The national flag was hoisted on the banks of the Ravi River at Lahore.","The Congress called for 26 January 1930 to be observed as Independence Day."]},{"l":"Why it mattered","p":"A year earlier the Nehru Report had asked for dominion status. At Lahore the goal became complete independence."},{"l":"Look ahead","p":"26 January returns in 1950, when the Constitution came into force and the day became Republic Day."}],"think":null,"scene":["dawn",258,62,["hills",134,14,4,3],["sea",150],["groundrect",168,5],["flag",190,168,1.3],["figs",40,150,174,6,3]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m3","yr":"1930","t":1930.2,"date":"26 January – November 1930","place":"Sabarmati Ashram to Dandi, Gujarat","short":"Dandi March","title":"The Dandi March and the salt law","region":"india","kind":"mv","deaths":0,"toll":"Civil Disobedience begins","lat":20.89,"lon":72.81,"loc2":null,"links":["m2","m4"],"blocks":[{"l":"What happened","ol":["26 January: Independence Day was observed across India to affirm the demand for Purna Swaraj.","12 March–6 April: Mahatma Gandhi led the Dandi March from Sabarmati Ashram to the coast of Dandi, where he broke the salt law. This launched the Civil Disobedience Movement.","November: The First Round Table Conference began in London. The Congress did not participate."]},{"l":"Why it mattered","p":"Breaking one law, the salt law, became the start of a country-wide movement. While the Congress stayed away, the first conference on India’s future was held in London."}],"think":"Dandi shows a movement that broke a law on purpose and in public. How is that different from the other acts on this timeline?","scene":["day",262,44,["hills",138,10,8,3],["sea",118],["groundrect",190,4],["figs",30,290,188,16,4]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m4","yr":"1931","t":1931.18,"date":"March – December 1931","place":"Delhi and London","short":"Gandhi–Irwin Pact","title":"The Gandhi–Irwin Pact and three executions","region":"india","kind":"mv","deaths":0,"toll":"Pact, then executions","lat":28.61,"lon":77.21,"loc2":null,"links":["m3","m5"],"blocks":[{"l":"What happened","ol":["5 March: The Gandhi–Irwin Pact was signed. The Congress agreed to suspend the Civil Disobedience Movement and take part in the next Round Table Conference; the government agreed to certain concessions.","23 March: Bhagat Singh, Rajguru and Sukhdev were executed by the British.","September–December: Gandhi attended the Second Round Table Conference in London, but it ended without an agreement."]},{"l":"Why it mattered","p":"Talks paused the movement, but the London conference ended with no agreement. Less than three weeks after the pact, three revolutionaries were executed."}],"think":"The British executed Bhagat Singh, Rajguru and Sukhdev; many Indians remember them as martyrs. Compare Muzaffarpur in 1908. Who decides which label lasts?","scene":["haze",60,50,["hills",140,12,6,3],["dome",160,172,1.6],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m5","yr":"1932","t":1932.73,"date":"August – 24 September 1932","place":"Poona (Pune)","short":"Poona Pact","title":"The Communal Award and the Poona Pact","region":"india","kind":"mv","deaths":0,"toll":"Reserved seats agreed","lat":18.52,"lon":73.86,"loc2":null,"links":["m4","m6"],"blocks":[{"l":"What happened","ol":["August: British Prime Minister Ramsay MacDonald announced the Communal Award, which provided separate electorates for several communities, including the Depressed Classes.","24 September: The Poona Pact was signed by representatives of caste-Hindu and Depressed Class leaders, including B. R. Ambedkar. It provided reserved seats for the Depressed Classes within joint electorates."]},{"l":"Why it mattered","p":"The question was how the Depressed Classes would be represented. The Award gave separate electorates; the Pact replaced them with reserved seats inside joint electorates."}],"think":"The Award and the Pact answered the same question in different ways. What are the trade-offs between separate electorates and reserved seats?","scene":["dusk",70,70,["hills",136,12,7,3],["block",90,172,140,70,4,"arch"],["lamp",50,172],["lamp",270,172],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m6","yr":"1933–37","t":1935.6,"date":"1933 – 1937","place":"British India (provinces)","short":"Act of 1935","title":"From civil disobedience to provincial ministries","region":"india","kind":"mv","deaths":0,"toll":"Provincial autonomy","lat":28.61,"lon":77.21,"loc2":null,"links":["m5","m7"],"blocks":[{"l":"What happened","ol":["1933: Gandhi continued campaigns against untouchability and worked for the social uplift of oppressed communities.","1934: The Civil Disobedience Movement was formally withdrawn.","August 1935: The Government of India Act, 1935 was passed. It introduced provincial autonomy and proposed an all-India federation, although the federation never came into operation. It became an important constitutional reference for later developments.","1936: The All India Kisan Sabha was established to organise peasants and raise issues such as rents, land revenue and rural debt.","1937: Provincial elections were held under the 1935 Act. The Indian National Congress formed ministries in several provinces."]},{"l":"Why it mattered","p":"After the movement was withdrawn in 1934, politics shifted to elections and organisation. The 1935 Act gave the provinces more self-government, and the 1937 elections put Congress ministries in several of them."}],"think":null,"scene":["day",260,46,["hills",140,12,9,3],["dome",150,172,1.9],["palms",40,176,2],["palms",282,176,2],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m7","yr":"1938–39","t":1939.67,"date":"1938 – 1939","place":"Haripura (Gujarat) and across British India","short":"War and resignations","title":"India is taken into the Second World War","region":"india","kind":"mv","deaths":0,"toll":"Ministries resign","lat":21.17,"lon":73.35,"loc2":null,"links":["m6","m8"],"blocks":[{"l":"What happened","ol":["1938: Subhas Chandra Bose was elected President of the Indian National Congress at the Haripura Session. The Congress also showed greater interest in economic planning.","September 1939: The Second World War began. The British government declared India to be at war without consulting Indian political leaders.","October–November 1939: Congress provincial ministries resigned in protest against the decision to involve India in the war without Indian consent.","1939: Subhas Chandra Bose later formed the Forward Bloc after differences with the Congress leadership."]},{"l":"Why it mattered","p":"India was declared at war without being asked. The Congress ministries that had been formed in 1937 resigned in protest, and Bose split from the Congress leadership."}],"think":null,"scene":["storm",240,52,["clouds",8],["hills",144,16,10,3],["roofs",148,4],["groundrect",176,5],["figs",60,260,182,10,6]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m8","yr":"1940–41","t":1940.2,"date":"March 1940 – 1941","place":"Lahore and across British India","short":"Lahore Resolution","title":"Three answers to the war years","region":"india","kind":"mv","deaths":0,"toll":"Lahore Resolution","lat":31.55,"lon":74.34,"loc2":null,"links":["m7","m9"],"blocks":[{"l":"What happened","ol":["March 1940: The Muslim League adopted the Lahore Resolution, calling for independent states in the Muslim-majority areas of north-western and eastern India.","August 1940: The British government announced the August Offer, proposing expanded Indian participation in government but not immediate independence.","October 1940: The Individual Satyagraha campaign began; Vinoba Bhave was the first satyagrahi.","1941: Subhas Chandra Bose left India and travelled abroad to seek international support for the struggle against British rule."]},{"l":"Why it mattered","p":"Within two years of the war starting there were a demand for separate states, a limited British offer, a Congress protest campaign, and Bose’s departure abroad. The last of these leads to Azad Hind in 1943."},{"l":"Look ahead","p":"The Lahore Resolution is the political root of the Partition of 1947."}],"think":null,"scene":["dusk",250,60,["hills",138,14,11,3],["tent",120,172,100],["tent",230,172,70],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m9","yr":"1942","t":1942.6,"date":"March – August 1942","place":"Bombay and across India","short":"Quit India","title":"Cripps fails, then Quit India","region":"india","kind":"mv","deaths":0,"toll":"Quit India","lat":18.93,"lon":72.83,"loc2":null,"links":["m8","m10"],"blocks":[{"l":"What happened","ol":["March–April: The Cripps Mission came to India with proposals for constitutional changes after the Second World War. The proposals were rejected by major Indian political groups.","8 August: The All India Congress Committee passed the Quit India resolution in Bombay, calling for an end to British rule.","August onwards: Gandhi and other major Congress leaders were arrested. Protests and demonstrations spread across many parts of India."]},{"l":"Why it mattered","p":"After the Cripps proposals were rejected, the Congress called for an end to British rule within months. With its main leaders arrested, protests and demonstrations still spread across many parts of the country."}],"think":null,"scene":["haze",250,50,["city",152,9,3,72,1],["block",196,178,40,128,4,"tower"],["sea",176],["groundrect",186,5],["flag",90,176,1.2]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m10","yr":"1943–45","t":1944.3,"date":"21 October 1943 – 1945","place":"Singapore, Imphal–Kohima, Simla and Delhi (Red Fort)","short":"Azad Hind and INA","title":"Azad Hind, the INA and the Red Fort trials","region":"india","kind":"mv","deaths":0,"toll":"INA and famine","lat":28.66,"lon":77.24,"loc2":null,"links":["m9","m11"],"blocks":[{"l":"What happened","ol":["21 October 1943: Subhas Chandra Bose announced the formation of the Provisional Government of Azad Hind in Singapore.","1943: A severe famine affected Bengal, causing widespread hunger and loss of life.","1944: The Indian National Army (INA), associated with Bose, took part in campaigns in the north-east, including the Imphal and Kohima operations.","May 1945: The war in Europe ended; the Second World War ended globally in September.","June–July 1945: The Wavell Plan was discussed at the Simla Conference, but agreement between political leaders could not be reached.","November 1945 onwards: The INA trials began at the Red Fort in Delhi, attracting widespread public attention and support for the INA soldiers."]},{"l":"Why it mattered","p":"The Simla talks failed, while the Red Fort trials made the INA’s soldiers a public cause across the country."}],"think":"The INA took up arms against British rule, and the public backed its soldiers at the Red Fort. How do audiences, courts and later historians judge armed struggle differently?","scene":["night",250,44,["hills",146,16,12,3],["fort",160,172,150],["palms",40,176,2],["palms",282,176,2],["groundrect",172,5]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m11","yr":"1946","t":1946.7,"date":"February – 9 December 1946","place":"Bombay, Calcutta and Delhi","short":"Road to the Constituent Assembly","title":"1946: from Cabinet Mission to the Constituent Assembly","region":"india","kind":"mv","deaths":0,"toll":"Constituent Assembly meets","lat":28.61,"lon":77.21,"loc2":null,"links":["m10","e3","m12"],"blocks":[{"l":"What happened","ol":["February: A revolt by ratings of the Royal Indian Navy began in Bombay and spread to other centres.","May: The Cabinet Mission proposed a plan for the transfer of power and the formation of a Constituent Assembly.","16 August: The Muslim League observed Direct Action Day; communal violence broke out in Calcutta and spread to other areas.","2 September: An Interim Government was formed, with Jawaharlal Nehru as its Vice-President.","9 December: The Constituent Assembly met for the first time to begin the task of framing India’s Constitution."]},{"l":"Why it mattered","p":"In a single year there was a naval revolt, a plan for the transfer of power, communal violence, an interim government and the first meeting of the body that would write the Constitution."}],"think":"Direct Action Day shows how violence in one city can spread to others. What conditions let that happen?","scene":["dawn",262,68,["hills",136,12,13,3],["dome",160,172,2.1],["groundrect",172,5],["figs",50,270,180,8,7]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m12","yr":"1947","t":1947.62,"date":"20 February – 15 August 1947","place":"Delhi, and the new borders of India and Pakistan","short":"Independence and Partition","title":"Independence, and the Partition of British India","region":"india","kind":"mv","deaths":0,"toll":"Independence and Partition","lat":28.61,"lon":77.21,"loc2":null,"links":["m11","m13"],"blocks":[{"l":"What happened","ol":["20 February: British Prime Minister Clement Attlee announced that British rule in India would end by June 1948.","3 June: The Mountbatten Plan announced the partition of British India into two dominions, India and Pakistan.","18 July: The Indian Independence Act received royal assent in the British Parliament.","15 August: India became an independent nation. Partition led to the creation of Pakistan and caused large-scale migration and communal violence."]},{"l":"Why it mattered","p":"Independence came about ten months before the date Attlee had announced. Freedom and Partition arrived together, with large-scale migration and communal violence."},{"l":"Echoes today","p":"The India–Pakistan border created in 1947 sits behind the crises that appear later on this timeline."}],"think":"Independence and Partition came together. How can one story hold both?","scene":["dawn",160,112,["hills",140,12,14,3],["fort",160,172,170],["groundrect",172,5],["flag",160,172,1.6]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m13","yr":"1948","t":1948.08,"date":"30 January – September 1948","place":"New Delhi and Hyderabad","short":"Gandhi assassinated","title":"Gandhi is assassinated; the princely states join","region":"india","kind":"mv","deaths":0,"toll":"Gandhi assassinated","lat":28.61,"lon":77.21,"loc2":null,"links":["m12","m14"],"blocks":[{"l":"What happened","ol":["30 January: Mahatma Gandhi was assassinated in New Delhi.","1948: The integration of princely states into the Indian Union continued under the leadership of Sardar Vallabhbhai Patel and V. P. Menon.","September: The princely state of Hyderabad was integrated into India following a military-police action commonly known as Operation Polo."]},{"l":"Why it mattered","p":"Gandhi was killed less than six months after independence. The new state kept bringing the princely states into the Union, ending with Hyderabad in September."}],"think":null,"scene":["dusk",70,96,["hills",142,12,15,3],["lamp",70,172],["lamp",250,172],["groundrect",172,5],["figs",120,200,180,4,8]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]},{"id":"m14","yr":"1949–50","t":1950.07,"date":"26 November 1949 – 26 January 1950","place":"New Delhi","short":"Constitution and Republic","title":"The Constitution is adopted; India becomes a republic","region":"india","kind":"mv","deaths":0,"toll":"Republic of India","lat":28.61,"lon":77.21,"loc2":null,"links":["m13"],"blocks":[{"l":"What happened","ol":["26 November 1949: The Constituent Assembly adopted the Constitution of India. The date is observed as Constitution Day.","26 January 1950: The Constitution of India came into force. India became a sovereign democratic republic, and 26 January began to be celebrated as Republic Day."]},{"l":"Why it mattered","p":"The Constituent Assembly that first met on 9 December 1946 finished its work in just under three years. The date the Congress had asked the country to observe as Independence Day in 1930 became Republic Day."}],"think":"Chapter ends here: from Purna Swaraj in 1929 to a Constitution in 1950. Which events in this chapter most shaped the document?","scene":["day",250,46,["hills",140,12,16,3],["dome",120,172,1.7],["groundrect",172,5],["flag",230,172,1.5]],"chain":false,"next":null,"sources":[{"l":"NCERT / DIKSHA, Class XII History support material"},{"l":"Ministry of Education, History XII Support Material (2023–24)"},{"l":"Delhi High Court, A History of India (chronology)"},{"l":"India Seminar, ‘A timeline of Congress history’"}]}],"world":"M110.0 136.6h0M107.8 134.4h0M110.0 134.4h0M107.8 132.2h0M110.0 132.2h0M112.2 132.2h0M105.6 130.0h0M107.8 130.0h0M110.0 130.0h0M112.2 130.0h0M114.4 130.0h0M107.8 127.8h0M110.0 127.8h0M112.2 127.8h0M114.4 127.8h0M347.6 127.8h0M349.8 127.8h0M107.8 125.6h0M110.0 125.6h0M112.2 125.6h0M114.4 125.6h0M325.6 125.6h0M352.0 125.6h0M107.8 123.4h0M110.0 123.4h0M112.2 123.4h0M114.4 123.4h0M116.6 123.4h0M356.4 123.4h0M107.8 121.2h0M110.0 121.2h0M112.2 121.2h0M114.4 121.2h0M116.6 121.2h0M118.8 121.2h0M121.0 121.2h0M321.2 121.2h0M323.4 121.2h0M325.6 121.2h0M354.2 121.2h0M356.4 121.2h0M107.8 119.0h0M110.0 119.0h0M112.2 119.0h0M114.4 119.0h0M116.6 119.0h0M118.8 119.0h0M121.0 119.0h0M123.2 119.0h0M319.0 119.0h0M321.2 119.0h0M323.4 119.0h0M325.6 119.0h0M327.8 119.0h0M330.0 119.0h0M110.0 116.8h0M112.2 116.8h0M114.4 116.8h0M116.6 116.8h0M118.8 116.8h0M121.0 116.8h0M123.2 116.8h0M125.4 116.8h0M200.2 116.8h0M202.4 116.8h0M204.6 116.8h0M297.0 116.8h0M299.2 116.8h0M301.4 116.8h0M303.6 116.8h0M316.8 116.8h0M319.0 116.8h0M321.2 116.8h0M323.4 116.8h0M325.6 116.8h0M327.8 116.8h0M330.0 116.8h0M110.0 114.6h0M112.2 114.6h0M114.4 114.6h0M116.6 114.6h0M118.8 114.6h0M121.0 114.6h0M123.2 114.6h0M125.4 114.6h0M train:(M,x,b,s)=>{let o=`<g transform="translate(${x} ${b}) scale(${s})"><rect x="-2" y="-2" width="300" height="2.4" fill="${M.dark}"/>`;for(let i=0;i<3;i++){const dx=i*98;o+=`<rect x="${dx}" y="-30" width="94" height="26" rx="5" fill="#8a96a3" stroke="${M.dark}" stroke-width=".8"/><rect x="${dx}" y="-18" width="94" height="4" fill="#d4402a" opacity=".85"/>`;for(let j=0;j<5;j++)o+=`<rect x="${dx+8+j*17}" y="-26" width="11" height="8" fill="${M.win}" stroke="${M.dark}" stroke-width=".4"/>`}return o+'</g>'},

MO.flag=(M,x,b,s)=>`<g transform="translate(${x} ${b}) scale(${s})"><rect x="-1" y="-70" width="2" height="70" fill="${M.dark}"/><rect x="1" y="-70" width="30" height="7" fill="#e8892b"/><rect x="1" y="-63" width="30" height="7" fill="#f4f1e6"/><rect x="1" y="-56" width="30" height="7" fill="#2e8b57"/><circle cx="16" cy="-59.5" r="2.4" fill="none" stroke="#1d3d8f" stroke-width=".6"/></g>`;
